<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula04</title>
</head>
<body>
    <h2>-------------Formulario------------</h2>
    <hr style="position: relative;">
    <form style="border:4px solid; width: fit-content;"> <center>
        <label for="nome">Nome:</label>  <!-- Oq vai aparecer antes do imput  e o "for" é "para" em ingles-->
        <input type="text" id="nome" name="nome" placeholder="Escreva seu nome" required > <!-- O "id" é o identificador. o "name=" vai salvar o valor escrito pelo usuario em algum lugar no banco de dados. o "required" faz com que o campo seja obrigatorio -->
        <!--  <button type="submit">Enviar</button> -->
        <br>
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="nome@gmail.com" required>
        <br>
        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua Senha" ></input>
        <br>
        <label for="idade">idade</label>
        <input type="number" id="idade" name="idade" min="14" max="100">
        <br>
        <label for="">Data de Nascimento:</label>
        <input type="date" id="data" name="data">
        <br>
        <label for="">Telefone:</label>
        <input type="tel" id="telefone" name="telefone" maxlength="15" placeholder="(11) 99999-9999" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" title="Digite no formato: (11) 99999-9999">
        <br>
        <label for="">Foto</label>
        <input type="file" id="foto" name="foto">
        <br>
        <p>Turno preferido</p>
        <input type="radio" id="manha" name="turno" value="manha">
        <label for="manha">Manhã</label>
        <br>
        <input type="radio" id="manha" name="turno" value="tarde">
        <label for="tarde">tarde</label>
        <br>
        <input type="radio" id="manha" name="turno" value="noite">
        <label for="noite">noite</label>
        <br>
        <button type="reset">Reset</button>
        <br>
        <input type="checkbox" id="lima" name="materia">
        <label for="">Lima</label>
        <input type="checkbox" id="pbe" name="materia" volue="PBE">
        <label for="">PEB</label>
        <input type="checkbox" id="bcd" name="materia" value="BCD">
        <label for="">BCD</label>


         <p>Ao terminar envie seu formulario:<button type="submit">Enviar</button> </p>
    </form>
    </center>
</body>
</html>
